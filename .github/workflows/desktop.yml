name: Desktop app

# Builds the Windows, Mac and Linux apps and attaches them to a GitHub release.
# Release:  git tag v1.0.0 && git push origin v1.0.0
# Trial run without a release: Actions → Desktop app → Run workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: ubuntu-latest
            args: --linux --x64 --arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build Slyd's server
        run: |
          npm ci --no-audit --no-fund
          STANDALONE=1 NEXT_PUBLIC_SITE_URL=http://localhost:3737 npm run build
          npm run desktop:server

      - name: Set the app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Package the app
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: slyd-${{ runner.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download Slyd

            | System | File |
            | --- | --- |
            | Windows | `Slyd-Setup-x64.exe` |
            | Mac with Apple silicon (M1 and later) | `Slyd-mac-arm64.dmg` |
            | Mac with Intel | `Slyd-mac-x64.dmg` |
            | Linux | `Slyd-linux-x86_64.AppImage` (ARM: `Slyd-linux-arm64.AppImage`) |

            While Slyd is open, AI agents can use it at `http://localhost:3737/mcp`.

            **First launch:** the app isn't code-signed yet.
            - Windows: if SmartScreen appears, choose **More info → Run anyway**.
            - Mac: right-click Slyd in Applications → **Open** → **Open**. If macOS says it's damaged, run `xattr -cr /Applications/Slyd.app` in Terminal once.
            - Linux: `chmod +x Slyd-linux-*.AppImage`, then run it.
